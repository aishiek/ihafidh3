name: Send Custom Broadcast

on:
    workflow_dispatch:
        inputs:
            title:
                description: "Notification Title"
                required: true
                default: "iHafidh Update"
            body:
                description: "Notification Message"
                required: true
                default: "Check out the latest features in iHafidh!"
            type:
                description: "Message Type"
                required: true
                type: choice
                options:
                    - announcement
                    - greeting
                    - promotion
                    - update
                default: "announcement"
            timezone:
                description: 'Target Timezone (use "all" for everyone, or specific like "0800", "-0500")'
                required: true
                default: "all"

jobs:
    send-broadcast:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3

            - name: Setup Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: "18"

            - name: Install Dependencies
              run: npm install firebase-admin

            - name: Send Broadcast
              run: node scripts/notifications/send-broadcast.js
              env:
                  FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
                  BROADCAST_TITLE: ${{ github.event.inputs.title }}
                  BROADCAST_BODY: ${{ github.event.inputs.body }}
                  BROADCAST_TYPE: ${{ github.event.inputs.type }}
                  TARGET_TIMEZONE: ${{ github.event.inputs.timezone }}
